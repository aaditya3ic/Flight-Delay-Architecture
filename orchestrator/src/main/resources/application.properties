spring.application.name=orchestrator

# Server Configuration
server.port=8080

# Neon PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://ep-blue-bread-b5sk6f0o-pooler.c-7.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=${DB_PASSWORD}&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
